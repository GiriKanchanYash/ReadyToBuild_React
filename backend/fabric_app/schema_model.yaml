# Semantic model for Microsoft Fabric AI Skill / Azure OpenAI grounding
# Database: ReadyToBuild | Schema: information_mart
version: 1.0
database: ReadyToBuild
schema: information_mart
tables:
- table_name: asn_in_transit_dt
  display_name: ASN In-Transit Shipments
  description: Advance Shipping Notices (ASNs) for inbound purchase order shipments that are currently
    in transit from suppliers to plants.
  synonyms:
  - ASN
  - Advance Shipping Notice
  - In-Transit Shipments
  - Inbound Shipments
  - Shipment Tracking
  primary_key:
  - ASN_ID
  foreign_keys:
  - column: SUPPLIER_ID
    references:
      table: supplier_summary_dt
      column: SUPPLIER_ID
  - column: RECEIVING_PLANT_ID
    references:
      table: plant_dt
      column: PLANT_ID
  relationships:
  - table: supplier_summary_dt
    join: asn_in_transit_dt.SUPPLIER_ID = supplier_summary_dt.SUPPLIER_ID
    cardinality: ManyToOne
  - table: plant_dt
    join: asn_in_transit_dt.RECEIVING_PLANT_ID = plant_dt.PLANT_ID
    cardinality: ManyToOne
  columns:
  - name: ASN_ID
    display_name: ASN ID
    datatype: string
    business_description: Unique identifier of the advance shipping notice.
    synonyms:
    - ASN ID
    - ASN Number
    - Shipment Notice ID
  - name: PO_ID
    display_name: PO ID
    datatype: string
    business_description: Identifier of the purchase order this shipment is fulfilling.
    synonyms:
    - PO Number
    - Order Number
  - name: PO_LINE_ID
    display_name: PO Line ID
    datatype: string
    business_description: Identifier of the specific purchase order line being shipped.
    synonyms:
    - PO Line
    - Order Line
  - name: SUPPLIER_ID
    display_name: Supplier ID
    datatype: string
    business_description: Unique identifier of the supplier.
    synonyms:
    - Supplier ID
    - Supplier Number
    - Supplier Key
  - name: PART_NUMBER
    display_name: Part Number
    datatype: string
    business_description: Unique identifier of the part or material.
    synonyms:
    - Part No
    - Material Number
    - SKU
    - Item Number
  - name: QTY_SHIPPED
    display_name: Qty Shipped
    datatype: decimal(38,0)
    business_description: Quantity of the part shipped by the supplier on this ASN.
    synonyms:
    - Shipped Quantity
    - Qty Shipped
  - name: UNIT_OF_MEASURE
    display_name: Unit Of Measure
    datatype: string
    business_description: Unit in which the quantity is measured (e.g. EA, KG, L).
    synonyms:
    - UOM
    - Unit
    - Measure Unit
  - name: SHIP_DATE
    display_name: Ship Date
    datatype: date
    business_description: Date the shipment left the supplier's facility.
    synonyms:
    - Ship Date
    - Departure Date
  - name: EXPECTED_ARRIVAL_DATE
    display_name: Expected Arrival Date
    datatype: date
    business_description: Date the shipment is expected to arrive at the receiving plant.
    synonyms:
    - ETA
    - Expected Arrival
    - Expected Delivery Date
  - name: CARRIER_NAME
    display_name: Carrier Name
    datatype: string
    business_description: Descriptive name of the associated entity.
    synonyms:
    - Name
    - Title
  - name: TRACKING_NUMBER
    display_name: Tracking Number
    datatype: string
    business_description: Tracking number issued by the carrier for the shipment.
    synonyms:
    - Tracking No
    - Shipment Tracking Number
  - name: ASN_STATUS
    display_name: ASN Status
    datatype: string
    business_description: Current status of the advance shipping notice (e.g. In Transit, Delivered, Delayed).
    synonyms:
    - Shipment Status
    - ASN Status
  - name: RECEIVING_PLANT_ID
    display_name: Receiving Plant ID
    datatype: string
    business_description: Identifier of the plant that will receive the shipment.
    synonyms:
    - Receiving Plant
    - Destination Plant
  - name: UPDATED_AT
    display_name: Updated At
    datatype: timestamp
    business_description: Timestamp when the record was last updated.
    synonyms:
    - Last Updated
    - Modified Date
    - Refresh Time
  measures:
  - QTY_SHIPPED
  dimensions:
  - SUPPLIER_ID
  - PART_NUMBER
  - CARRIER_NAME
  - ASN_STATUS
  - RECEIVING_PLANT_ID
  - SHIP_DATE
  - EXPECTED_ARRIVAL_DATE
  sample_questions:
  - Which ASNs are in transit and overdue for arrival?
  - Show inbound shipments by carrier for the last 7 days.
  - What quantity of part X is currently in transit to plant Y?
- table_name: bom_dt
  display_name: Bill of Materials
  description: Bill of Materials (BOM) header and component records describing the parent-child part structure,
    quantities, and effective dates used to build products.
  synonyms:
  - BOM
  - Bill of Materials
  - Parts List
  - Product Structure
  - Component List
  primary_key:
  - BOM_ID
  foreign_keys:
  - column: MAKE_PLANT_ID
    references:
      table: plant_dt
      column: PLANT_ID
  relationships:
  - table: plant_dt
    join: bom_dt.MAKE_PLANT_ID = plant_dt.PLANT_ID
    cardinality: ManyToOne
  columns:
  - name: BOM_ID
    display_name: BOM ID
    datatype: string
    business_description: Unique identifier of the bill of materials line.
    synonyms:
    - BOM ID
    - BOM Line ID
  - name: BOM_HEADER_ID
    display_name: BOM Header ID
    datatype: string
    business_description: Identifier of the BOM header this line belongs to.
    synonyms:
    - BOM Header
    - BOM Group ID
  - name: BOM_VERSION
    display_name: BOM Version
    datatype: string
    business_description: Version of the Bill of Materials.
    synonyms:
    - BOM Version
    - BOM Revision
  - name: BOM_STATUS
    display_name: BOM Status
    datatype: string
    business_description: Current lifecycle status of the BOM (e.g. Active, Obsolete, Draft).
    synonyms:
    - BOM Status
  - name: PARENT_PART_NUMBER
    display_name: Parent Part Number
    datatype: string
    business_description: Part number of the parent assembly consuming the child component.
    synonyms:
    - Parent Part
    - Assembly Part Number
  - name: PARENT_PART_DESCRIPTION
    display_name: Parent Part Description
    datatype: string
    business_description: Description of the parent assembly.
    synonyms:
    - Parent Part Name
    - Assembly Description
  - name: PARENT_PART_TYPE
    display_name: Parent Part Type
    datatype: string
    business_description: Classification of the parent part (e.g. finished good, sub-assembly).
    synonyms:
    - Parent Part Category
  - name: PARENT_PART_REVISION
    display_name: Parent Part Revision
    datatype: string
    business_description: Engineering revision of the parent part.
    synonyms:
    - Parent Revision
  - name: CHILD_PART_NUMBER
    display_name: Child Part Number
    datatype: string
    business_description: Part number of the component consumed by the parent assembly.
    synonyms:
    - Component Part Number
    - Child Part
  - name: CHILD_PART_DESCRIPTION
    display_name: Child Part Description
    datatype: string
    business_description: Description of the child component.
    synonyms:
    - Component Description
    - Child Part Name
  - name: CHILD_PART_TYPE
    display_name: Child Part Type
    datatype: string
    business_description: Classification of the child part (e.g. raw material, purchased component).
    synonyms:
    - Component Type
  - name: CHILD_PART_REVISION
    display_name: Child Part Revision
    datatype: string
    business_description: Engineering revision of the child part.
    synonyms:
    - Child Revision
  - name: QTY_REQUIRED
    display_name: Qty Required
    datatype: decimal(18,4)
    business_description: Quantity of the child part required per parent assembly, including scrap.
    synonyms:
    - Required Quantity
    - Qty Required
  - name: UNIT_OF_MEASURE
    display_name: Unit Of Measure
    datatype: string
    business_description: Unit in which the quantity is measured (e.g. EA, KG, L).
    synonyms:
    - UOM
    - Unit
    - Measure Unit
  - name: QTY_PER_ASSEMBLY
    display_name: Qty Per Assembly
    datatype: decimal(18,4)
    business_description: Base quantity of the child part consumed per single unit of the parent assembly.
    synonyms:
    - Qty per Assembly
    - Usage Quantity
  - name: SCRAP_FACTOR_PCT
    display_name: Scrap Factor %
    datatype: decimal(5,2)
    business_description: Expected scrap percentage applied to the required quantity for this component.
    synonyms:
    - Scrap Rate
    - Scrap Percentage
  - name: MB_INDICATOR
    display_name: MB Indicator
    datatype: string
    business_description: Make/Buy indicator showing whether the component is manufactured in-house or
      purchased.
    synonyms:
    - Make/Buy Flag
    - Make or Buy
  - name: MAKE_PLANT_ID
    display_name: Make Plant ID
    datatype: string
    business_description: Identifier of the plant where the parent assembly is manufactured.
    synonyms:
    - Manufacturing Plant
    - Make Plant
  - name: BOM_LEVEL
    display_name: BOM Level
    datatype: decimal(3,0)
    business_description: Level of the component within the BOM hierarchy, where 0 is the top-level product.
    synonyms:
    - BOM Level
    - Hierarchy Level
  - name: ASSEMBLY_LEAD_TIME_DAYS
    display_name: Assembly Lead Time Days
    datatype: decimal(5,0)
    business_description: Number of days required to assemble the parent from this component.
    synonyms:
    - Assembly Lead Time
  - name: EFFECTIVE_DATE
    display_name: Effective Date
    datatype: date
    business_description: Date from which this BOM line becomes effective.
    synonyms:
    - Effective Date
    - Start Date
  - name: EXPIRY_DATE
    display_name: Expiry Date
    datatype: date
    business_description: Date after which this BOM line is no longer effective.
    synonyms:
    - Expiry Date
    - End Date
  - name: CREATED_AT
    display_name: Created At
    datatype: timestamp
    business_description: Timestamp when the record was first created.
    synonyms:
    - Created Date
    - Creation Time
    - Insert Date
  - name: UPDATED_AT
    display_name: Updated At
    datatype: timestamp
    business_description: Timestamp when the record was last updated.
    synonyms:
    - Last Updated
    - Modified Date
    - Refresh Time
  measures:
  - QTY_REQUIRED
  - QTY_PER_ASSEMBLY
  - SCRAP_FACTOR_PCT
  - ASSEMBLY_LEAD_TIME_DAYS
  dimensions:
  - PARENT_PART_NUMBER
  - CHILD_PART_NUMBER
  - BOM_STATUS
  - MAKE_PLANT_ID
  - BOM_LEVEL
  sample_questions:
  - What components are required to build part X?
  - Show the current BOM version for product Y.
  - Which parts have the highest scrap factor?
- table_name: bom_explode_dt
  display_name: Exploded Bill of Materials
  description: Multi-level, fully exploded Bill of Materials showing every child component required, directly
    or indirectly, to build a root product, along with the extended quantity per unit and the level/path
    in the BOM hierarchy.
  synonyms:
  - Exploded BOM
  - Multi-Level BOM
  - BOM Explosion
  - Component Rollup
  primary_key:
  - ROOT_PRODUCT
  - PARENT_PART_NUMBER
  - CHILD_PART_NUMBER
  columns:
  - name: ROOT_PRODUCT
    display_name: Root Product
    datatype: string
    business_description: Top-level finished product for which the BOM was fully exploded.
    synonyms:
    - Root Product
    - Top-Level Product
    - Finished Good
  - name: PARENT_PART_NUMBER
    display_name: Parent Part Number
    datatype: string
    business_description: Part number of the immediate parent of the child component in this exploded
      level.
    synonyms:
    - Parent Part
  - name: CHILD_PART_NUMBER
    display_name: Child Part Number
    datatype: string
    business_description: Part number of the component at this level of the exploded BOM.
    synonyms:
    - Component Part Number
    - Child Part
  - name: CHILD_PART_DESCRIPTION
    display_name: Child Part Description
    datatype: string
    business_description: Description of the component at this level.
    synonyms:
    - Component Description
  - name: CHILD_PART_TYPE
    display_name: Child Part Type
    datatype: string
    business_description: Classification of the component (e.g. raw material, sub-assembly).
    synonyms:
    - Component Type
  - name: QTY_PER_ASSEMBLY
    display_name: Qty Per Assembly
    datatype: decimal(18,4)
    business_description: Quantity of the component consumed per unit of its immediate parent.
    synonyms:
    - Qty per Assembly
  - name: EXTENDED_QTY
    display_name: Extended Qty
    datatype: decimal(18,4)
    business_description: Total quantity of the component required per single unit of the root product,
      after multiplying through all BOM levels.
    synonyms:
    - Extended Quantity
    - Rolled-Up Quantity
    - Total Required Qty
  - name: BOM_LEVEL
    display_name: BOM Level
    datatype: int
    business_description: Depth of the component within the exploded BOM hierarchy relative to the root
      product.
    synonyms:
    - BOM Level
    - Explosion Level
  - name: BOM_PATH
    display_name: BOM Path
    datatype: string
    business_description: Full parent-to-child path describing how the component is nested under the root
      product.
    synonyms:
    - BOM Path
    - Component Path
  measures:
  - QTY_PER_ASSEMBLY
  - EXTENDED_QTY
  dimensions:
  - ROOT_PRODUCT
  - PARENT_PART_NUMBER
  - CHILD_PART_NUMBER
  - BOM_LEVEL
  sample_questions:
  - Show the fully exploded BOM for product X.
  - How many total units of part Y are needed to build one unit of product Z?
  - What is the BOM path from the root product down to part X?
- table_name: build_sequence_dt
  display_name: Build Sequence Plan
  description: Planned build sequence of parts required for each product by build week and build stage,
    indicating whether safety stock is being used to cover the requirement.
  synonyms:
  - Build Sequence
  - Build Plan
  - Production Sequence
  - Build Schedule
  primary_key:
  - SEQUENCE_ID
  columns:
  - name: SEQUENCE_ID
    display_name: Sequence ID
    datatype: string
    business_description: Unique identifier of the build sequence record.
    synonyms:
    - Sequence ID
    - Build Sequence Number
  - name: PRODUCT_ID
    display_name: Product ID
    datatype: string
    business_description: Unique identifier of the product.
    synonyms:
    - Product ID
    - Product Number
    - Product Key
  - name: BUILD_WEEK
    display_name: Build Week
    datatype: decimal(38,0)
    business_description: Planning week number in which the part is required for the build.
    synonyms:
    - Build Week
    - Planning Week
  - name: PART_NUMBER
    display_name: Part Number
    datatype: string
    business_description: Unique identifier of the part or material.
    synonyms:
    - Part No
    - Material Number
    - SKU
    - Item Number
  - name: QTY_REQUIRED
    display_name: Qty Required
    datatype: decimal(38,0)
    business_description: Quantity of the part required for the build in this week/stage.
    synonyms:
    - Required Quantity
  - name: BUILD_STAGE
    display_name: Build Stage
    datatype: string
    business_description: Stage of the build process the requirement applies to (e.g. Kitting, Sub-Assembly,
      Final Assembly).
    synonyms:
    - Build Stage
    - Production Stage
  - name: CREATED_AT
    display_name: Created At
    datatype: timestamp
    business_description: Timestamp when the record was first created.
    synonyms:
    - Created Date
    - Creation Time
    - Insert Date
  - name: USING_SAFETY_STOCK
    display_name: Using Safety Stock
    datatype: boolean
    business_description: Indicates whether safety stock is being used to cover this build requirement.
    synonyms:
    - Uses Safety Stock
    - Safety Stock Flag
  measures:
  - QTY_REQUIRED
  dimensions:
  - PRODUCT_ID
  - PART_NUMBER
  - BUILD_STAGE
  - BUILD_WEEK
  sample_questions:
  - What parts are required for product X in build week 5?
  - Which build stages rely on safety stock the most?
  - Show the build sequence plan for the next 4 weeks.
- table_name: ctb_result_dt
  display_name: Capable-to-Build (CTB) Results
  description: Results of Capable-to-Build (CTB) calculations for work orders, showing how many units
    can be built from on-hand inventory, scheduled deliveries, and safety stock.
  synonyms:
  - CTB
  - Capable to Build
  - Buildability Analysis
  - Build Capability
  primary_key:
  - CTB_ID
  foreign_keys:
  - column: WORK_ORDER_ID
    references:
      table: work_order_dt
      column: WORK_ORDER_ID
  - column: PLANT_ID
    references:
      table: plant_dt
      column: PLANT_ID
  relationships:
  - table: work_order_dt
    join: ctb_result_dt.WORK_ORDER_ID = work_order_dt.WORK_ORDER_ID
    cardinality: ManyToOne
  - table: plant_dt
    join: ctb_result_dt.PLANT_ID = plant_dt.PLANT_ID
    cardinality: ManyToOne
  columns:
  - name: CTB_ID
    display_name: CTB ID
    datatype: string
    business_description: Unique identifier of the Capable-to-Build calculation record.
    synonyms:
    - CTB ID
    - CTB Result Number
  - name: WORK_ORDER_ID
    display_name: Work Order ID
    datatype: string
    business_description: Unique identifier of the work order.
    synonyms:
    - Work Order ID
    - Work Order Number
    - Work Order Key
  - name: PRODUCT_ID
    display_name: Product ID
    datatype: string
    business_description: Unique identifier of the product.
    synonyms:
    - Product ID
    - Product Number
    - Product Key
  - name: PLANT_ID
    display_name: Plant ID
    datatype: string
    business_description: Unique identifier of the plant.
    synonyms:
    - Plant ID
    - Plant Number
    - Plant Key
  - name: CALCULATION_DATE
    display_name: Calculation Date
    datatype: date
    business_description: Date the Capable-to-Build calculation was run.
    synonyms:
    - Calculation Date
    - Run Date
  - name: REQUESTED_QTY
    display_name: Requested Qty
    datatype: decimal(38,0)
    business_description: Quantity of the product requested to be built on the work order.
    synonyms:
    - Requested Quantity
    - Demand Quantity
  - name: CAN_BUILD_QTY
    display_name: Can Build Qty
    datatype: decimal(38,0)
    business_description: Quantity that can actually be built given current constraints.
    synonyms:
    - Buildable Quantity
    - Can-Build Quantity
  - name: CTB_STATUS
    display_name: CTB Status
    datatype: string
    business_description: Overall Capable-to-Build outcome (e.g. Full, Partial, Blocked).
    synonyms:
    - CTB Status
    - Buildability Status
  - name: CAN_BUILD_BASE
    display_name: Can Build Base
    datatype: bigint
    business_description: Quantity buildable using only on-hand inventory, before considering deliveries
      or safety stock.
    synonyms:
    - Base Buildable Quantity
  - name: CAN_BUILD_WITH_DELIVERIES
    display_name: Can Build With Deliveries
    datatype: bigint
    business_description: Quantity buildable when scheduled incoming deliveries are also counted.
    synonyms:
    - Buildable With Deliveries
  - name: CAN_BUILD_WITH_SAFETY
    display_name: Can Build With Safety
    datatype: bigint
    business_description: Quantity buildable when safety stock is also released for use.
    synonyms:
    - Buildable With Safety Stock
  - name: CAN_BUILD_FULL
    display_name: Can Build Full
    datatype: bigint
    business_description: Maximum quantity buildable across all available supply sources.
    synonyms:
    - Full Buildable Quantity
  - name: PRODUCTION_STATUS
    display_name: Production Status
    datatype: string
    business_description: Production status of the work order at the time of the CTB calculation.
    synonyms:
    - Production Status
  - name: WEEK_START
    display_name: Week Start
    datatype: timestamp
    business_description: Start date/time of the planning week for this CTB calculation.
    synonyms:
    - Week Start
  - name: PLANNED_START_DATE
    display_name: Planned Start Date
    datatype: date
    business_description: Planned start date of the work order being evaluated.
    synonyms:
    - Planned Start Date
  measures:
  - REQUESTED_QTY
  - CAN_BUILD_QTY
  - CAN_BUILD_BASE
  - CAN_BUILD_WITH_DELIVERIES
  - CAN_BUILD_WITH_SAFETY
  - CAN_BUILD_FULL
  dimensions:
  - WORK_ORDER_ID
  - PRODUCT_ID
  - PLANT_ID
  - CTB_STATUS
  - PRODUCTION_STATUS
  - CALCULATION_DATE
  sample_questions:
  - How many units of work order X can we build today?
  - Which work orders are blocked from being fully built?
  - Show CTB results by plant for this week.
- table_name: inventory_dt
  display_name: Inventory Snapshot
  description: Point-in-time inventory snapshot by plant and part, including on-hand, reserved, in-transit,
    and available quantities, costs, and safety stock levels.
  synonyms:
  - Inventory
  - Stock Levels
  - On-Hand Inventory
  - Warehouse Stock
  primary_key:
  - INVENTORY_ID
  foreign_keys:
  - column: PLANT_ID
    references:
      table: plant_dt
      column: PLANT_ID
  relationships:
  - table: plant_dt
    join: inventory_dt.PLANT_ID = plant_dt.PLANT_ID
    cardinality: ManyToOne
  columns:
  - name: INVENTORY_ID
    display_name: Inventory ID
    datatype: string
    business_description: Unique identifier of the inventory.
    synonyms:
    - Inventory ID
    - Inventory Number
    - Inventory Key
  - name: PLANT_ID
    display_name: Plant ID
    datatype: string
    business_description: Unique identifier of the plant.
    synonyms:
    - Plant ID
    - Plant Number
    - Plant Key
  - name: PART_NUMBER
    display_name: Part Number
    datatype: string
    business_description: Unique identifier of the part or material.
    synonyms:
    - Part No
    - Material Number
    - SKU
    - Item Number
  - name: PART_DESCRIPTION
    display_name: Part Description
    datatype: string
    business_description: Descriptive name of the part or material.
    synonyms:
    - Part Name
    - Material Description
    - Item Description
  - name: PART_TYPE
    display_name: Part Type
    datatype: string
    business_description: Classification of the part (e.g. raw material, sub-assembly, finished good).
    synonyms:
    - Part Category
    - Material Type
    - Item Type
  - name: STORAGE_LOCATION
    display_name: Storage Location
    datatype: string
    business_description: Specific storage location or bin within the plant where the part is held.
    synonyms:
    - Storage Bin
    - Warehouse Location
  - name: STOCK_TYPE
    display_name: Stock Type
    datatype: string
    business_description: Classification of the stock (e.g. Unrestricted, Blocked, Quality Inspection).
    synonyms:
    - Stock Type
    - Inventory Category
  - name: UNIT_OF_MEASURE
    display_name: Unit Of Measure
    datatype: string
    business_description: Unit in which the quantity is measured (e.g. EA, KG, L).
    synonyms:
    - UOM
    - Unit
    - Measure Unit
  - name: QTY_ON_HAND
    display_name: Qty On Hand
    datatype: decimal(18,4)
    business_description: Total physical quantity of the part currently on hand at the plant.
    synonyms:
    - On-Hand Quantity
    - Stock on Hand
  - name: QTY_RESERVED
    display_name: Qty Reserved
    datatype: decimal(18,4)
    business_description: Quantity of the part reserved against open demand.
    synonyms:
    - Reserved Quantity
    - Allocated Quantity
  - name: QTY_IN_TRANSIT
    display_name: Qty In Transit
    datatype: decimal(18,4)
    business_description: Quantity of the part currently in transit and not yet received.
    synonyms:
    - In-Transit Quantity
  - name: QTY_AVAILABLE
    display_name: Qty Available
    datatype: decimal(18,4)
    business_description: Quantity of the part available for new demand (on-hand minus reserved).
    synonyms:
    - Available Quantity
    - Free Stock
  - name: MOVING_AVG_PRICE
    display_name: Moving Avg Price
    datatype: decimal(18,4)
    business_description: Moving average unit price of the part.
    synonyms:
    - Moving Average Price
    - MAP
  - name: STANDARD_COST
    display_name: Standard Cost
    datatype: decimal(18,4)
    business_description: Standard unit cost of the part.
    synonyms:
    - Standard Cost
    - Std Cost
  - name: CURRENCY_CODE
    display_name: Currency Code
    datatype: string
    business_description: ISO currency code used for monetary values on this record.
    synonyms:
    - Currency
    - Currency Type
  - name: TOTAL_STOCK_VALUE
    display_name: Total Stock Value
    datatype: decimal(18,4)
    business_description: Total inventory value of the part at this location (quantity x cost).
    synonyms:
    - Stock Value
    - Inventory Value
  - name: REORDER_POINT
    display_name: Reorder Point
    datatype: decimal(18,4)
